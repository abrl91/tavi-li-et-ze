[project]
name = "tavi-li-et-ze"
version = "0.1.0"
description = "Agentic tools built on Tavily + Nebius Token Factory."
readme = "README.md"
requires-python = ">=3.13.0"
dependencies = [
    "tavily-python==0.7.24",
    "openai==2.36.0",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.47.0",
    "jinja2==3.1.6",
    "numpy==2.4.4",
    "sqlite-utils==3.39",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = ["pytest==9.0.3"]

[project.scripts]
brief = "ai_news_scout.cli:main"
api = "ai_news_scout.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_news_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
